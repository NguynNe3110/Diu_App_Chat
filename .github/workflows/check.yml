            elif printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d ' \t\r\n' | base64 --decode > app/google-services.json 2>/dev/null; then
              true
            else
              rm -f app/google-services.json
            fi
          fi
          if [ ! -s app/google-services.json ]; then
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "diuchat-ci-placeholder",
              "storage_bucket": "diuchat-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.uzuu.diuchat"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCiBuildOnly00000000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: lintDebug
        run: ./gradlew lint

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results*.html
            feature/*/build/reports/lint-results*.html
            library/*/build/reports/lint-results*.html

  detekt:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: detekt
        run: ./gradlew detektCheck

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: detekt-report
          path: |
            build/reports/detekt/detekt.*
            app/build/reports/detekt/detekt.*
            feature/*/build/reports/detekt/detekt.*
            library/*/build/reports/detekt/detekt.*
            konsist-test/build/reports/detekt/detekt.*

  konsist:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: konsist
        run: ./gradlew konsist-test:test --rerun-tasks

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: konsist-report
          path: ./konsist-test/build/reports/*

